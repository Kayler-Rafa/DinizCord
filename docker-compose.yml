services:
  postgres:
    image: postgres:17-alpine
    container_name: dinizcord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dinizcord
      POSTGRES_PASSWORD: dinizcord
      POSTGRES_DB: dinizcord
    ports:
      - '5432:5432'
    volumes:
      - dinizcord-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dinizcord -d dinizcord']
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplicação e gateway ficam no perfil "full": o fluxo padrão de
  # desenvolvimento é rodar só o banco em container e o resto com `npm run
  # dev:all`, que dá hot reload. Use `docker compose --profile full up` para
  # subir a stack inteira em containers.
  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_WS_URL: ws://localhost:3001
        NEXT_PUBLIC_STUN_SERVER: stun:stun.l.google.com:19302
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dinizcord:dinizcord@postgres:5432/dinizcord?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env antes de subir a stack completa}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - '3000:3000'

  gateway:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dinizcord:dinizcord@postgres:5432/dinizcord?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env antes de subir a stack completa}
      WS_PORT: '3001'
      WS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - '3001:3001'

volumes:
  dinizcord-pgdata:
